server {
    listen  80;
    listen  [::]:80; 

    server_name preview.vici.org;
    return 301 https://preview.vici.org$request_uri;
}

server {
    listen  443 ssl;
    listen  [::]:443 ssl;

    server_name preview.vici.org;

    # ssl_certificate / ssl_certificate_key as managed on the host (e.g. certbot)

    add_header X-Frame-Options "SAMEORIGIN";
    # the widget is embedded on third-party sites (livius.org etc.), so
    # statics and API responses need to be readable cross-origin. This is
    # the single place CORS is handled — the app does not emit it itself.
    add_header Access-Control-Allow-Origin "*" always;
    client_max_body_size 100M;

    # Everything (statics + app) is served by the docker preview stack
    # (docker-compose.yml); this vhost only terminates TLS.
    location / {
        # CORS preflight short-circuit; add_header inside `if` does not
        # inherit the server-level directives, so repeat them here
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Headers "X-Requested-With, X-Vici-Token" always;
            return 204;
        }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 500;
    }

    access_log /var/log/nginx/org.vici.preview.log;
}
