server {
    listen  80;
    listen  [::]:80; 

    server_name preview.vici.org;
    return 301 https://preview.vici.org$request_uri;
}

server {
    listen  443 ssl;
    listen  [::]:443 ssl;

    server_name preview.vici.org;

    # ssl_certificate / ssl_certificate_key as managed on the host (e.g. certbot)

    add_header X-Frame-Options "SAMEORIGIN";
    client_max_body_size 100M;

    # Everything (statics + app) is served by the docker preview stack
    # (docker-compose.preview.yml); this vhost only terminates TLS.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 500;
    }

    access_log /var/log/nginx/org.vici.preview.log;
}
