name: vici-novo-preview

# Preview stack for preview.vici.org on the production server.
#
# Two database modes, selected via .env.preview:
#   a) production DB on the host: DB_HOST=host.docker.internal (default)
#      — requires mysqld to also listen on the docker bridge
#   b) dockerized DB with a fresh dump: DB_HOST=mysql and start with
#      --profile localdb; drop .sql/.sql.gz dumps in ./db-preview/ first
#      (that dir is gitignored; files run in alphabetical order on first
#      init, like db/*.sql.gz does for the dev stack)
#
# Other differences with docker-compose.yml (local dev):
#   - the real uploads dir is bind-mounted into public/uploads, so uploads
#     land exactly where main / images.vici.org expect them (set
#     PROD_UPLOADS_DIR to a local dir instead if you want full isolation)
#   - web publishes on 127.0.0.1 only; the host nginx terminates TLS and
#     proxies preview.vici.org here (see nginx/preview.vici.org.conf)
#
# Before first start on the server:
#   1. cp .env.preview.example .env.preview  and fill in real values.
#      Note: compose does NOT read .env.preview automatically — pass
#      --env-file .env.preview so ${…} interpolations (PROD_STATIC_DIR,
#      PROD_UPLOADS_DIR, PREVIEW_PORT) resolve from it.
#   2. (mode a) make sure the host MySQL listens on the docker bridge as
#      well — a bind-address of 127.0.0.1 only will NOT work
#      (mode b) place dump files in ./db-preview/
#   3. make sure the uploads dir (PROD_UPLOADS_DIR) is writable by the
#      php-fpm user in the container (www-data, uid 33 — same as Debian's)
#
# Start:             docker compose -f docker-compose.preview.yml --env-file .env.preview up -d --build
# Start with db:     docker compose -f docker-compose.preview.yml --env-file .env.preview --profile localdb up -d --build
# Logs:              docker compose -f docker-compose.preview.yml --env-file .env.preview logs -f php
# Note: with --profile localdb, wait for vici-preview-mysql to become
# healthy (importing a full dump takes a while) before browsing.

services:
  web:
    image: nginx:1.27-alpine
    container_name: vici-preview-web
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-8081}:80"
    volumes:
      - ./public:/var/www/local.vici.novo/public:ro
      # public/vendor/ckeditor is a symlink to ../../vendor/ckeditor
      - ./vendor/ckeditor:/var/www/local.vici.novo/vendor/ckeditor:ro
      # production uploads dir, read-only: serves /uploads/... locally so the
      # CDN-fallback URLs work even for files the CDN hasn't picked up yet
      - ${PROD_UPLOADS_DIR:-/var/www/org.vici.static/public/uploads}:/var/www/local.vici.novo/public/uploads:ro
      - ./docker/nginx/preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - vici-preview-net

  php:
    build: ./docker/php
    container_name: vici-preview-php
    volumes:
      - ./:/var/www/local.vici.novo
      - ./.env.preview:/var/www/local.vici.novo/.env:ro
      # production uploads dir, read-write: only used in local-storage
      # mode (no S3_BUCKET set). With S3 enabled uploads go to object
      # storage and this mount is unused by the uploader.
      - ${PROD_UPLOADS_DIR:-/var/www/org.vici.static/public/uploads}:/var/www/local.vici.novo/public/uploads
      # whole static root, read-only: source for the S3 migration
      # (bin/sync-images-to-s3.php /srv/static — covers uploads/, livius/
      # and any other img_path prefix)
      - ${PROD_STATIC_DIR:-/var/www/org.vici.static/public}:/srv/static:ro
      # account-activation mails are sent via msmtp (sendmail emulation);
      # mount a real msmtprc so mail() can reach an SMTP relay
      # - ./docker/php/msmtprc:/etc/msmtprc:ro
    extra_hosts:
      # makes DB_HOST=host.docker.internal resolve to the host
      - "host.docker.internal:host-gateway"
    networks:
      - vici-preview-net

  # Optional containerized database (mode b above). Only starts with
  # --profile localdb; set DB_HOST=mysql in .env.preview in that case.
  mysql:
    profiles: ["localdb"]
    image: mariadb:11.4
    container_name: vici-preview-mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: vici
      MYSQL_USER: vici
      MYSQL_PASSWORD: vici
    volumes:
      - vici-preview-db-data:/var/lib/mysql
      - ./db-preview:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - vici-preview-net

volumes:
  vici-preview-db-data:

networks:
  vici-preview-net:
