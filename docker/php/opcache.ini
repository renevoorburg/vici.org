; Production-ish opcache tuning for the php-fpm container.
; Deploys happen via git pull on the bind-mounted repo, so timestamps
; stay on with per-request revalidation — cheaper than an opcache_reset
; deploy step, and bytecode still comes from the cache.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; vendor/ alone is ~4.6k php files (aws-sdk), so give both headroom
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
