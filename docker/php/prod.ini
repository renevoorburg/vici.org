; Production hardening for the preview/production-like stack
; (docker-compose.yml). The local dev stack does not mount this file,
; so display_errors stays on there.
;
; Never leak stack traces or internal paths to clients; errors go to the
; container logs instead (docker compose logs php).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
