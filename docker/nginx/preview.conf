server {
    listen       80;
    server_name  _;

    client_max_body_size 100M;

    # Requests arrive via the host nginx proxy (see nginx/preview.vici.org.conf),
    # so REMOTE_ADDR would be the docker gateway for everyone. Restore the real
    # client IP from X-Forwarded-For — AccessControl rate-limits and bans per IP.
    # Only trusted proxies may set the header; the published port is bound to
    # 127.0.0.1 on the host, so only the host nginx can reach this server.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # composer-installed web assets (CKEditor) served straight from vendor/;
    # no PHP execution or source disclosure from there
    location ^~ /vendor/ {
        alias /var/www/local.vici.novo/vendor/;
        location ~* \.php$ {
            return 404;
        }
    }

    location / {
        root   /var/www/local.vici.novo/public/;
        try_files $uri @app;
    }

    location @app {
        fastcgi_pass   php:9000;
        fastcgi_param  SCRIPT_FILENAME  /var/www/local.vici.novo/app/controller.php;
        fastcgi_param SCRIPT_NAME     /controller.php;
        fastcgi_param QUERY_STRING    q=$uri&$args;
        include        fastcgi_params;
        fastcgi_read_timeout 500;
    }
}
