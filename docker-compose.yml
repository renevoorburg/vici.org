name: vici-novo

services:
  # nginx serves public/ statics and fastcgi-proxies everything else
  # to the front controller app/controller.php on the php container.
  web:
    image: nginx:1.27-alpine
    container_name: vici-novo-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/local.vici.novo/public:ro
      # public/vendor/ckeditor is a symlink to ../../vendor/ckeditor
      - ./vendor/ckeditor:/var/www/local.vici.novo/vendor/ckeditor:ro
      - ./docker/nginx/novo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - vici-net

  php:
    build: ./docker/php
    container_name: vici-novo-php
    volumes:
      - ./:/var/www/local.vici.novo
      - ./.env.docker:/var/www/local.vici.novo/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vici-net

  mysql:
    image: mariadb:11.4
    container_name: vici-novo-mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: vici
      MYSQL_USER: vici
      MYSQL_PASSWORD: vici
    volumes:
      - vici-db-data:/var/lib/mysql
      - ./db/geo.sql.gz:/docker-entrypoint-initdb.d/10-geo.sql.gz:ro
      - ./db/vici.sql.gz:/docker-entrypoint-initdb.d/20-vici.sql.gz:ro
      - ./docker/db/z-grants.sql:/docker-entrypoint-initdb.d/30-grants.sql:ro
      - ./docker/db/40-dev-account.sql:/docker-entrypoint-initdb.d/40-dev-account.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - vici-net

volumes:
  vici-db-data:

networks:
  vici-net:
