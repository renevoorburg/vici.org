name: vici-novo-preview

# Server stack: preview or production depending on the env file passed
# with --env-file (.env.preview, or a prod .env later). The host nginx
# terminates TLS and proxies the vhost to 127.0.0.1:$PORT.
#
# The stack always runs its own MariaDB (the app uses DB_HOST=mysql).
# On first init it imports every .sql/.sql.gz in ./db-preview/ in
# alphabetical order (that dir is gitignored), so drop dumps there
# before the first `up`.
#
# Differences with docker-compose.local.yml (local dev):
#   - the real uploads dir is bind-mounted into public/uploads, so uploads
#     land exactly where main / images.vici.org expect them (set
#     PROD_UPLOADS_DIR to a local dir instead if you want full isolation)
#   - web publishes on 127.0.0.1 only; the host nginx terminates TLS and
#     proxies the vhost here (see nginx/preview.vici.org.conf)
#
# Before first start on the server:
#   1. cp .env.preview.example .env.preview  and fill in real values.
#      Note: compose only reads .env automatically — pass the env file
#      with --env-file so ${…} interpolations (PROD_STATIC_DIR,
#      PROD_UPLOADS_DIR, PORT) resolve from it.
#   2. place dump files in ./db-preview/
#   3. make sure the uploads dir (PROD_UPLOADS_DIR) is writable by the
#      php-fpm user in the container (www-data, uid 33 — same as Debian's)
#
# Start:             docker compose --env-file .env.preview up -d --build
# Logs:              docker compose --env-file .env.preview logs -f php
# Note: on first start, wait for vici-preview-mysql to become healthy
# (importing a full dump takes a while) before browsing.

services:
  web:
    image: nginx:1.27-alpine
    container_name: vici-preview-web
    ports:
      - "127.0.0.1:${PORT:-8081}:80"
    volumes:
      - ./public:/var/www/local.vici.novo/public:ro
      # public/vendor/ckeditor is a symlink to ../../vendor/ckeditor
      - ./vendor/ckeditor:/var/www/local.vici.novo/vendor/ckeditor:ro
      # production uploads dir, read-only: serves /uploads/... locally so the
      # CDN-fallback URLs work even for files the CDN hasn't picked up yet
      - ${PROD_UPLOADS_DIR:-/var/www/org.vici.static/public/uploads}:/var/www/local.vici.novo/public/uploads:ro
      - ./docker/nginx/preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - vici-preview-net

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: vici-preview-php
    volumes:
      - ./:/var/www/local.vici.novo
      - ./${ENV_FILE:-.env.preview}:/var/www/local.vici.novo/.env:ro
      # production uploads dir, read-write: only used in local-storage
      # mode (no S3_BUCKET set). With S3 enabled uploads go to object
      # storage and this mount is unused by the uploader.
      - ${PROD_UPLOADS_DIR:-/var/www/org.vici.static/public/uploads}:/var/www/local.vici.novo/public/uploads
      # whole static root, read-only: source for the S3 migration
      # (bin/sync-images-to-s3.php /srv/static — covers uploads/, livius/
      # and any other img_path prefix)
      - ${PROD_STATIC_DIR:-/var/www/org.vici.static/public}:/srv/static:ro
      # mail() works out of the box: /etc/msmtprc is baked into the image
      # and relays to the Postfix on this host via host.docker.internal:25.
      # Mount a custom msmtprc here for an authenticated SMTP relay instead:
      # - /etc/vici/msmtprc:/etc/msmtprc:ro
    extra_hosts:
      # lets msmtp reach the Postfix on the host for outgoing mail
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vici-preview-net

  mysql:
    image: mariadb:11.4
    container_name: vici-preview-mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --innodb-buffer-pool-size=1G
    ports:
      # loopback only: for admin tools over an SSH tunnel (e.g. DBeaver → localhost:3307)
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      # app credentials are reused so DB_USER/DB_PASS/DB_MAIN in the env
      # file always match the account the entrypoint creates
      MYSQL_DATABASE: ${DB_MAIN:-vici}
      MYSQL_USER: ${DB_USER:-vici}
      MYSQL_PASSWORD: ${DB_PASS:-vici}
    volumes:
      - vici-preview-db-data:/var/lib/mysql
      - ./db-preview:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - vici-preview-net

volumes:
  vici-preview-db-data:

networks:
  vici-preview-net:
