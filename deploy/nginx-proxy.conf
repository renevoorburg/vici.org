# Minimal nginx reverse proxy for vici.org
# Place this in /etc/nginx/sites-available/vici.org
# Then: ln -s /etc/nginx/sites-available/vici.org /etc/nginx/sites-enabled/

# Docker container port. Must match NGINX_PORT in .env.prod
upstream vici_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location = /robots.txt {
        root /etc/nginx/robots;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://vici_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
